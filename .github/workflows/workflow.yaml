name: Deployment of assignment1

on:
  push:
    branches:
      - "dev"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  s3-upload:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        shell: python
        run: |
          import os
          print(f"Printing Path: {os.environ['PATH']}")

      - name: Running shell script
        run: |
          pip3 --version
          python3 --version
          mkdir new-folder/python
          ls
          echo "Runner Workspace: $RUNNER_WORKSPACE"
          cd ./deploy_scripts
          echo "Runner Workspace: $RUNNER_WORKSPACE"
      - name: another
        working-directory: ./deploy_scripts
        run: |
          ls
          echo "Runner Workspace: $RUNNER_WORKSPACE"
      - name: python one
        working-directory: python
        run: |
          pip3 install boto3 -t.
          ls
      - name: zipping
        working-directory: new-folder
        run: |
          ls
